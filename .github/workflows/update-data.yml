name: Validate Yeongdeungpo dashboard v17

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate static v17
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/site-data.json").read_text(encoding="utf-8"))
          by={c["name"]:c for c in d["complexes"]}
          assert by["당산동1차효성아파트"]["far"]==280
          assert len(by["당산동1차효성아파트"]["tx"])>=10
          assert by["당산동대우"]["far"]==399.5
          assert by["당산동부센트레빌"]["far"]==276.9
          assert by["당산삼성래미안"]["far"]==299
          text=Path("index.html").read_text(encoding="utf-8")
          assert "k APT Dashboard v17" in text
          assert "floor<=3" in text
          assert "oldE.selectedMonth<=newE.selectedMonth" in text
          assert "saveFilterPreset" in text
          assert "loadFilterPreset" in text
          print("OK v17")
          PY
