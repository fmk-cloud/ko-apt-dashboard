name: Validate static Yeongdeungpo dashboard v15

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate static files
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          index=Path("index.html")
          data_path=Path("data/site-data.json")
          assert index.exists(), "index.html 없음"
          assert data_path.exists(), "data/site-data.json 없음"

          d=json.loads(data_path.read_text(encoding="utf-8"))
          cs=d.get("complexes",[])
          assert cs, "단지 데이터 0건"
          assert set(c.get("region") for c in cs)=={"영등포구"}
          assert sum(bool(c.get("tx")) for c in cs)>0

          text=index.read_text(encoding="utf-8")
          assert "k APT Dashboard v15" in text
          assert "window.__EMBEDDED_DATA__=" in text

          print("complexes:",len(cs))
          print("sale complexes:",sum(bool(c.get("tx")) for c in cs))
          print("300+ households:",sum((c.get("households") or 0)>=300 for c in cs))
          print("OK - static dashboard validated")
          PY
