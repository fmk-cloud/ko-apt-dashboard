name: Validate Yeongdeungpo dashboard v18

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate static v18
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/site-data.json").read_text(encoding="utf-8"))
          assert d["meta"]["loaded_regions"]==["영등포구"]
          assert len(d["complexes"])==160
          text=Path("index.html").read_text(encoding="utf-8")
          assert "k APT Dashboard v18" in text
          assert "function filterComplex(c)" in text
          assert "let DATA = window.__EMBEDDED_DATA__;" in text
          assert 'id="popLoad"' in text
          print("OK v18")
          PY
