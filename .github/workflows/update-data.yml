name: Update apartment dashboard data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full 권장 / incremental도 현재는 지정기간 전체 재구축"
        required: true
        default: full
        type: choice
        options: [full, incremental]
      enrich_far:
        description: "건축HUB 용적률 보강"
        required: true
        default: true
        type: boolean
  schedule:
    # 매월 1일 04:00 KST = 전날 19:00 UTC
    - cron: "0 19 28-31 * *"

permissions:
  contents: write

concurrency:
  group: k-apt-data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
      BUILDING_HUB_API_KEY: ${{ secrets.BUILDING_HUB_API_KEY }}
      KAPT_API_KEY: ${{ secrets.KAPT_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Calendar gate
        id: gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ "$(TZ=Asia/Seoul date +%d)" != "01" ]]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Build Seoul + Gyeonggi sale/rent data
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.enrich_far }}" == "false" ]]; then
            EXTRA="--skip-far"
          fi
          python scripts/build_data.py \
            --mode "${{ inputs.mode || 'full' }}" \
            --start 2025-07 \
            --output data/site-data.json \
            $EXTRA

      - name: Embed data into single static HTML
        if: steps.gate.outputs.run == 'true'
        run: python scripts/embed_data.py

      - name: Validate
        if: steps.gate.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/site-data.json").read_text(encoding="utf-8"))
          assert len(d["complexes"]) > 0
          regs=set(d["meta"]["loaded_regions"])
          for gu in ["강남구","서초구","송파구","영등포구","마포구","성동구"]:
              assert gu in regs, f"missing {gu}"
          has_rent=sum(bool(c.get("jeonse_tx")) for c in d["complexes"])
          has_far=sum(c.get("far") is not None for c in d["complexes"])
          has_station=sum(bool(c.get("station_walks")) or c.get("station_walk_minutes") is not None for c in d["complexes"])
          print("complexes",len(d["complexes"]))
          print("rent complexes",has_rent)
          print("FAR complexes",has_far)
          print("station-walk complexes",has_station)
          print("index bytes",Path("index.html").stat().st_size)
          PY

      - name: Commit refreshed site
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/site-data.json data/far-cache.json data/kapt-cache.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "data: refresh Seoul/Gyeonggi sale rent metadata"
          git push
