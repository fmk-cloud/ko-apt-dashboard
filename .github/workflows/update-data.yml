name: Update Yeongdeungpo dashboard v14

on:
  workflow_dispatch:
    inputs:
      enrich_far:
        description: "건축HUB 용적률 보강 시도"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: k-apt-yeongdeungpo-v14
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
      BUILDING_HUB_API_KEY: ${{ secrets.BUILDING_HUB_API_KEY }}
      KAPT_API_KEY: ${{ secrets.KAPT_API_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Yeongdeungpo data
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=""
          if [[ "${{ inputs.enrich_far }}" == "false" ]]; then
            EXTRA="--skip-far"
          fi
          python scripts/build_data.py \
            --start 2025-07 \
            --output data/site-data.json \
            $EXTRA

      - name: Embed latest data into index.html
        run: python scripts/embed_data.py

      - name: Validate core site
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          d=json.loads(Path("data/site-data.json").read_text(encoding="utf-8"))
          complexes=d.get("complexes",[])
          assert complexes, "영등포구 단지 데이터가 0건입니다."

          regions=set(d.get("meta",{}).get("loaded_regions",[]))
          assert "영등포구" in regions, f"영등포구 누락: {regions}"

          sale=sum(bool(c.get("tx")) for c in complexes)
          rent=sum(bool(c.get("jeonse_tx")) for c in complexes)
          households=sum(c.get("households") is not None for c in complexes)
          far=sum(c.get("far") is not None for c in complexes)
          stations=sum(bool(c.get("station_walks")) or c.get("station_walk_minutes") is not None for c in complexes)

          print("complexes:",len(complexes))
          print("sale complexes:",sale)
          print("rent complexes:",rent)
          print("household metadata:",households)
          print("FAR metadata:",far)
          print("station-walk metadata:",stations)
          print("api_status:",d.get("meta",{}).get("api_status"))

          # v14는 매매가 정상 수집되면 성공 처리.
          assert sale>0, "매매 데이터가 없습니다."
          assert Path("index.html").stat().st_size>100000
          PY

      - name: Commit refreshed Yeongdeungpo site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/site-data.json data/far-cache.json data/kapt-cache.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "data: refresh Yeongdeungpo v14"
          git push
