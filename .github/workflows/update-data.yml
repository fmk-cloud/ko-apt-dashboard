name: Update Seoul and Gyeonggi data
on:
  workflow_dispatch:
  schedule:
    # UTC 19:00 = next day 04:00 KST. Guard skips dates other than KST day 1.
    - cron: '0 19 28-31 * *'
permissions:
  contents: read
concurrency:
  group: k-apt-monthly-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Korea calendar
        id: calendar
        run: python scripts/schedule_due.py
      - name: Test data safety rules
        if: steps.calendar.outputs.due == 'true'
        run: python -m unittest discover -s tests -v
      - name: Collect official public data
        if: steps.calendar.outputs.due == 'true'
        run: python scripts/update_public.py
      - name: Refresh nearby stations with pedestrian network
        if: steps.calendar.outputs.due == 'true'
        run: |
          python -m pip install -r requirements-transport.txt
          python scripts/update_transport.py
      - name: Validate published HTML
        if: steps.calendar.outputs.due == 'true'
        run: python scripts/validate.py
      - name: Commit complete update
        if: steps.calendar.outputs.due == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data reports/update-report.json reports/coverage.json reports/transport-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Update official apartment data for Seoul and Gyeonggi"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
      - name: Keep collection report
        if: always() && steps.calendar.outputs.due == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: collection-report-${{ github.run_id }}
          path: reports/update-report.json
          retention-days: 30
