name: Validate Yeongdeungpo dashboard v16

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate static data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          d=json.loads(Path("data/site-data.json").read_text(encoding="utf-8"))
          by={c["name"]:c for c in d["complexes"]}

          assert "당산현대5차" in by
          assert "당산강변래미안3차" in by
          assert by["당산현대5차"]["far"] == 373
          assert by["당산강변래미안3차"]["far"] > 336
          assert len(by["당산강변래미안3차"]["tx"]) >= 10
          assert any(t[1] == 55.91 for t in by["당산강변래미안3차"]["tx"])

          text=Path("index.html").read_text(encoding="utf-8")
          assert "k APT Dashboard v16" in text
          assert "$('#popApply').onclick=applyPopover;" in text

          print("OK v16")
          print("complexes",len(d["complexes"]))
          print("modern5 tx",len(by["당산현대5차"]["tx"]))
          print("river tx",len(by["당산강변래미안3차"]["tx"]))
          PY
